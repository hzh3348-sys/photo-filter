name: 自动构建

on:
  push:
    tags: ["v*"]

jobs:
  # ── Windows 构建 ──
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install opencv-python mediapipe PySide6 pyinstaller
      - name: 构建
        run: python build_v2.py
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Windows-便携版
          path: 照片筛选GUI_v2.0_by_HZH.zip

  # ── macOS 构建 ──
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install opencv-python mediapipe PySide6 pyinstaller
      - name: 构建 .app
        run: python macos/build_mac.py
      - name: 打包为 zip
        run: |
          cd dist
          zip -r ../照片筛选工具_macOS.zip "照片筛选工具.app"
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macOS-app
          path: 照片筛选工具_macOS.zip

  # ── 创建 Release ──
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: 发布
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Windows-便携版/照片筛选GUI_v2.0_by_HZH.zip
            macOS-app/照片筛选工具_macOS.zip
