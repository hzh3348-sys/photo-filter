name: 自动构建

on:
  push:
    tags: ["v*"]

jobs:
  # ── Windows ──
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install opencv-python mediapipe PySide6 pyinstaller rawpy pillow
      - name: 构建
        shell: cmd
        run: |
          python -c "import PySide6,os;p=os.path.dirname(PySide6.__file__);print('PySide6:',p);import glob;plugs=glob.glob(os.path.join(p,'plugins','platforms','*'));print('plugins:',plugs[:3])"
          python build_v2.py
      - name: 验证产物
        shell: cmd
        run: |
          dir 照片筛选GUI_v5.1_by_HZH\ /s | findstr /i "exe themes"
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-便携版
          path: 照片筛选GUI_v5.1_by_HZH.zip
          retention-days: 1   # Release 取走后即可清理，避免占满私有仓库存储配额

  # ── macOS ──
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install opencv-python mediapipe PySide6 pyinstaller rawpy pillow
      - name: 构建 .app
        run: |
          pyinstaller --onedir --windowed \
            --name "照片筛选工具" \
            --add-data "face_landmarker.task:." \
            --add-data "resources/themes:resources/themes" \
            --collect-submodules mediapipe \
            --collect-binaries mediapipe \
            --collect-binaries rawpy \
            --exclude-module scipy \
            --exclude-module PyQt5 \
            --exclude-module PyQt6 \
            --exclude-module PySide2 \
            --exclude-module mkl \
            main.py
          cd dist
          zip -r ../照片筛选工具_macOS.zip "照片筛选工具.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-app
          path: 照片筛选工具_macOS.zip
          retention-days: 1

  # ── Release ──
  release:
    needs: [build-windows, build-macos]
    if: needs.build-windows.result == 'success' && needs.build-macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
      - name: 发布
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Windows-便携版/照片筛选GUI_v5.1_by_HZH.zip
            macOS-app/照片筛选工具_macOS.zip
          fail_on_unmatched_files: false
